<!DOCTYPE html> <!-- Declara que este documento segue o padrão HTML5 -->
<html lang="pt-BR"> <!-- Define o idioma principal do documento como português do Brasil -->

    <head> <!-- Cabeçalho do documento: contém metadados, título e links para arquivos externos -->
        <meta charset="UTF-8"> <!-- Define a codificação de caracteres como UTF-8 (suporte a acentos e ç) -->
        
        <!-- Garante a responsividade, ajustando a largura da página à tela do dispositivo móvel -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        
        <title>Tarefas App</title> <!-- Define o título que aparece na aba do navegador -->

        <!-- Importa o CSS do Bootstrap 5 via CDN para estilização rápida da página -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/cqss/bootstrap.min.css" rel="stylesheet">
    </head> <!-- Fechamento da seção do cabeçalho -->

    <body> <!-- Corpo da página: contém todo o conteúdo visível para o usuário -->

        <!-- Elemento visual de carregamento (Spinner) -->
        <!-- "d-flex justify-content-center" centraliza o elemento horizontalmente usando Flexbox -->
        <div class="d-flex justify-content-center">
            <!-- "spinner-border" cria o círculo giratório de carregamento do Bootstrap -->
            <div class="spinner-border" role="status" id="loading">
                <!-- Texto acessível para leitores de tela (invisível na tela comum) -->
                <span class="visually-hidden">Carregando...</span> 
            </div>
        </div>

        <!-- Título principal da página -->
        <!-- "h1" aplica o estilo visual de título do Bootstrap / "text-center" centraliza o texto -->
        <p class="h1 text-center">Tarefa de um usuário</p>

        <!-- Tabela onde as tarefas serão inseridas dinamicamente via JavaScript -->
        <!-- "id='tasks'" permite que o script JavaScript encontre e preencha a tabela -->
        <table class="table table-hover" id="tasks">
        </table>

        <!-- Importa o JavaScript do Bootstrap (necessário para componentes interativos como modais ou dropdowns) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
        
        <!-- Importa o seu arquivo JavaScript customizado (responsável por buscar os dados e preencher a tabela) -->
        <script src="script.js"></script>
    
    </body> <!-- Fechamento do corpo da página -->

</html> <!-- Fechamento do documento HTML -->
